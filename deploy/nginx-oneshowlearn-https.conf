limit_req_zone $binary_remote_addr zone=oneshowlearn_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name oneshowlearn.com www.oneshowlearn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/oneshowlearn-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://oneshowlearn.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.oneshowlearn.com;
    ssl_certificate /etc/letsencrypt/live/oneshowlearn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneshowlearn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://oneshowlearn.com$request_uri;
}

server {
    listen 443 ssl;
    server_name oneshowlearn.com;
    ssl_certificate /etc/letsencrypt/live/oneshowlearn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneshowlearn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OneShowLearnTLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/oneshowlearn.access.log;
    error_log /var/log/nginx/oneshowlearn.error.log;
    include /etc/nginx/snippets/oneshowlearn-app.conf;
}

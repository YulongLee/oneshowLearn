# HTTP-level closed list: read-only account refreshes do not share the login budget.
# Unknown paths and every mutation keep the original strict abuse protection.
map "$request_method:$uri" $oneshowlearn_auth_write_key {
    default $binary_remote_addr;
    "GET:/api/auth/status" "";
    "HEAD:/api/auth/status" "";
    "GET:/api/auth/me" "";
    "HEAD:/api/auth/me" "";
    "GET:/api/auth/profile" "";
    "HEAD:/api/auth/profile" "";
    "GET:/api/auth/identities" "";
    "HEAD:/api/auth/identities" "";
}
map "$request_method:$uri" $oneshowlearn_auth_read_key {
    default "";
    "GET:/api/auth/status" $binary_remote_addr;
    "HEAD:/api/auth/status" $binary_remote_addr;
    "GET:/api/auth/me" $binary_remote_addr;
    "HEAD:/api/auth/me" $binary_remote_addr;
    "GET:/api/auth/profile" $binary_remote_addr;
    "HEAD:/api/auth/profile" $binary_remote_addr;
    "GET:/api/auth/identities" $binary_remote_addr;
    "HEAD:/api/auth/identities" $binary_remote_addr;
}
limit_req_zone $oneshowlearn_auth_write_key zone=oneshowlearn_auth:10m rate=10r/m;
limit_req_zone $oneshowlearn_auth_read_key zone=oneshowlearn_auth_read:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name oneshowlearn.com www.oneshowlearn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/oneshowlearn-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://oneshowlearn.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.oneshowlearn.com;
    ssl_certificate /etc/letsencrypt/live/oneshowlearn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneshowlearn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://oneshowlearn.com$request_uri;
}

server {
    listen 443 ssl;
    server_name oneshowlearn.com;
    ssl_certificate /etc/letsencrypt/live/oneshowlearn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneshowlearn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OneShowLearnTLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/oneshowlearn.access.log;
    error_log /var/log/nginx/oneshowlearn.error.log;
    include /etc/nginx/snippets/oneshowlearn-app.conf;
}

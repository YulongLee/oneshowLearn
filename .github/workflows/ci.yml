name: Engineering acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:engineering
      - run: npm run test:engineering
      # Registry or TLS errors fail this check; never disable certificate validation.
      - run: npm run check:dependencies
      - name: Business regressions with actionable failure diagnostics
        run: node scripts/run-acceptance-with-diagnostics.mjs test
      - run: npm run build
      - name: Install isolated video fixture encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-acceptance-with-diagnostics.mjs test:browser
      - run: npm run ops -- build --release ci-${{ github.sha }}
      - run: npm run test:auth-proxy
        env:
          # BuildKit need not retain a base-image tag. Use the tagged web image just built.
          AUTH_PROXY_IMAGE: oneshowlearn-web:ci-${{ github.sha }}
      # npm run test:deployment, with bounded failure evidence in check annotations.
      - run: node scripts/run-acceptance-with-diagnostics.mjs test:deployment --release ci-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.sha }}
          path: artifacts/releases/*.json
          if-no-files-found: error
# This workflow tests/builds only. No SSH, secret credentials, registry push,
# production deployment or real gateway/model/SMS/email operation.
